name: Update Daily Navy News

on:
  schedule:
    - cron: "0 0 * * *" # 매일 UTC 00:00 (한국 시간 오전 9시) 자동 실행
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 허용

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch daily navy news
        run: python update_news.py

      - name: Commit and push news.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily navy news" && git push)
